<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#08121F"/>
      <stop offset="0.55" stop-color="#0F2C1D"/>
      <stop offset="1" stop-color="#14532D"/>
    </linearGradient>
    <linearGradient id="line" x1="120" y1="250" x2="1060" y2="250" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1E293B"/>
      <stop offset="0.5" stop-color="#22C55E"/>
      <stop offset="1" stop-color="#93C5FD"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .soft { fill: #C0CAF5; opacity: 0.8; font-family: 'Segoe UI', Arial, sans-serif; }
      .title { fill: white; font-weight: 700; font-family: 'Segoe UI', Arial, sans-serif; }
      .label { fill: #D1FAE5; font-weight: 600; font-family: 'Segoe UI', Arial, sans-serif; }
      .panel { fill: rgba(255,255,255,0.06); stroke: rgba(255,255,255,0.12); stroke-width: 1.5; }
      .pulse { animation: pulse 2.4s ease-in-out infinite; transform-origin: center; }
      .coin { animation: coin 1.6s ease-in-out infinite; transform-origin: center; }
      @keyframes pulse {
        0%, 100% { opacity: 0.6; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.18); }
      }
      @keyframes coin {
        0%, 100% { opacity: 0.55; transform: translateY(0px); }
        50% { opacity: 1; transform: translateY(-7px); }
      }
    </style>
  </defs>

  <rect width="1200" height="420" rx="26" fill="url(#bg)"/>
  <rect x="24" y="24" width="1152" height="372" rx="22" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.08)"/>

  <text x="60" y="78" class="title" font-size="34">RENAN TECH QUEST</text>
  <text x="60" y="108" class="soft" font-size="18">Uma jornada visual entre suporte, infraestrutura e desenvolvimento web</text>

  <rect x="60" y="140" width="260" height="86" rx="18" class="panel"/>
  <text x="82" y="174" class="label" font-size="18">MISSÃO ATUAL</text>
  <text x="82" y="204" class="soft" font-size="16">Construir interfaces mais claras,</text>
  <text x="82" y="225" class="soft" font-size="16">organizadas e confiáveis.</text>

  <rect x="880" y="140" width="260" height="86" rx="18" class="panel"/>
  <text x="902" y="174" class="label" font-size="18">FOCO</text>
  <text x="902" y="204" class="soft" font-size="16">React, Next.js, TypeScript,</text>
  <text x="902" y="225" class="soft" font-size="16">infra e melhoria contínua.</text>

  <path d="M120 275 C260 275, 260 210, 400 210 C540 210, 540 305, 700 305 C860 305, 860 220, 1060 220" stroke="url(#line)" stroke-width="10" stroke-linecap="round" filter="url(#glow)"/>

  <circle cx="170" cy="275" r="16" fill="#22C55E" class="pulse"/>
  <circle cx="430" cy="210" r="16" fill="#38BDF8" class="pulse"/>
  <circle cx="730" cy="305" r="16" fill="#A78BFA" class="pulse"/>
  <circle cx="1040" cy="220" r="16" fill="#F59E0B" class="pulse"/>

  <text x="135" y="315" class="label" font-size="16">SUPORTE</text>
  <text x="382" y="170" class="label" font-size="16">INFRA</text>
  <text x="690" y="345" class="label" font-size="16">FRONT-END</text>
  <text x="987" y="180" class="label" font-size="16">PRÓXIMO NÍVEL</text>

  <g class="coin">
    <circle cx="300" cy="238" r="7" fill="#FDE68A"/>
    <circle cx="585" cy="255" r="7" fill="#FDE68A"/>
    <circle cx="905" cy="252" r="7" fill="#FDE68A"/>
  </g>

  <g filter="url(#glow)">
    <rect x="-24" y="-24" width="48" height="48" rx="10" fill="#F8FAFC" stroke="#22C55E" stroke-width="3">
      <animateMotion dur="7.5s" repeatCount="indefinite" rotate="auto">
        <mpath href="#runnerPath"/>
      </animateMotion>
    </rect>
    <rect x="-9" y="-9" width="18" height="18" rx="5" fill="#22C55E">
      <animateMotion dur="7.5s" repeatCount="indefinite" rotate="auto">
        <mpath href="#runnerPath"/>
      </animateMotion>
    </rect>
  </g>

  <path id="runnerPath" d="M120 275 C260 275, 260 210, 400 210 C540 210, 540 305, 700 305 C860 305, 860 220, 1060 220" fill="none"/>

  <rect x="60" y="342" width="1080" height="20" rx="10" fill="rgba(255,255,255,0.08)"/>
  <rect x="60" y="342" width="280" height="20" rx="10" fill="#22C55E">
    <animate attributeName="width" values="180;360;540;720;940;1080;180" dur="7.5s" repeatCount="indefinite"/>
  </rect>
  <text x="60" y="334" class="soft" font-size="14">PROGRESSO DE EVOLUÇÃO</text>
</svg>
