<svg width="1200" height="460" viewBox="0 0 1200 460" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="80" y1="40" x2="1120" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07111B"/>
      <stop offset="0.55" stop-color="#0F2C1D"/>
      <stop offset="1" stop-color="#14532D"/>
    </linearGradient>
    <linearGradient id="laneGlow" x1="170" y1="0" x2="1030" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#153047"/>
      <stop offset="0.5" stop-color="#22C55E"/>
      <stop offset="1" stop-color="#60A5FA"/>
    </linearGradient>
    <linearGradient id="meter" x1="0" y1="0" x2="680" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22C55E"/>
      <stop offset="0.55" stop-color="#4ADE80"/>
      <stop offset="1" stop-color="#93C5FD"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .title { fill: #F8FAFC; font: 700 34px 'Segoe UI', Arial, sans-serif; }
      .subtitle { fill: #C0CAF5; opacity: 0.9; font: 500 17px 'Segoe UI', Arial, sans-serif; }
      .label { fill: #86EFAC; font: 700 14px 'Segoe UI', Arial, sans-serif; letter-spacing: 1px; }
      .value { fill: #F8FAFC; font: 700 26px 'Segoe UI', Arial, sans-serif; }
      .small { fill: #D1FAE5; font: 500 15px 'Segoe UI', Arial, sans-serif; }
      .soft { fill: #C0CAF5; opacity: 0.82; font: 500 14px 'Segoe UI', Arial, sans-serif; }
      .panel { fill: rgba(255,255,255,0.05); stroke: rgba(255,255,255,0.12); stroke-width: 1.5; }
      .lane { fill: rgba(255,255,255,0.04); stroke: rgba(255,255,255,0.08); stroke-width: 1.2; }
      .pulse { animation: pulse 2.2s ease-in-out infinite; transform-origin: center; }
      .coin { animation: coin 1.8s ease-in-out infinite; transform-origin: center; }
      @keyframes pulse {
        0%, 100% { opacity: 0.72; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.12); }
      }
      @keyframes coin {
        0%, 100% { opacity: 0.5; transform: translateY(0px); }
        50% { opacity: 1; transform: translateY(-7px); }
      }
    </style>
  </defs>

  <rect x="12" y="12" width="1176" height="436" rx="28" fill="url(#bg)"/>
  <rect x="28" y="28" width="1144" height="404" rx="24" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.08)"/>

  <text x="600" y="62" text-anchor="middle" class="title">CHARGE ARCADE</text>
  <text x="600" y="90" text-anchor="middle" class="subtitle">Um minijogo visual sobre suporte, infraestrutura e evolução para o front-end</text>

  <rect x="72" y="118" width="220" height="78" rx="18" class="panel"/>
  <text x="94" y="147" class="label">MISSÃO</text>
  <text x="94" y="173" class="small">Coletar energia, evitar ruídos</text>
  <text x="94" y="194" class="small">e manter o fluxo estável.</text>

  <rect x="318" y="118" width="190" height="78" rx="18" class="panel"/>
  <text x="340" y="147" class="label">RUN</text>
  <text x="340" y="178" class="value">FRONT-END</text>

  <rect x="534" y="118" width="132" height="78" rx="18" class="panel"/>
  <text x="556" y="147" class="label">NÍVEL</text>
  <text x="556" y="178" class="value">N1 → DEV</text>

  <rect x="692" y="118" width="150" height="78" rx="18" class="panel"/>
  <text x="714" y="147" class="label">COMBO</text>
  <text x="714" y="178" class="value">+128</text>

  <rect x="868" y="118" width="260" height="78" rx="18" class="panel"/>
  <text x="890" y="147" class="label">FOCO AGORA</text>
  <text x="890" y="173" class="small">React, Next.js, TypeScript</text>
  <text x="890" y="194" class="small">e experiências mais claras.</text>

  <rect x="118" y="220" width="964" height="154" rx="28" fill="rgba(0,0,0,0.16)" stroke="rgba(255,255,255,0.08)"/>

  <rect x="170" y="244" width="860" height="34" rx="17" class="lane"/>
  <rect x="170" y="288" width="860" height="34" rx="17" class="lane"/>
  <rect x="170" y="332" width="860" height="34" rx="17" class="lane"/>

  <path d="M210 261 H990" stroke="url(#laneGlow)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="18 16" opacity="0.9"/>
  <path d="M210 305 H990" stroke="url(#laneGlow)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="18 16" opacity="0.9"/>
  <path d="M210 349 H990" stroke="url(#laneGlow)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="18 16" opacity="0.9"/>

  <g filter="url(#glow)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="220 239;220 283;220 327;220 283;220 239" dur="7.2s" repeatCount="indefinite"/>
      <rect x="0" y="0" width="76" height="42" rx="21" fill="#F8FAFC" stroke="#22C55E" stroke-width="3"/>
      <circle cx="18" cy="21" r="9" fill="#22C55E"/>
      <rect x="33" y="18" width="26" height="6" rx="3" fill="#94A3B8"/>
      <path d="M62 10 L68 21 L62 32" stroke="#22C55E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <g class="coin">
    <circle cx="400" cy="261" r="10" fill="#FDE68A">
      <animate attributeName="cx" values="400;175;400" dur="4.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="690" cy="305" r="10" fill="#FDE68A">
      <animate attributeName="cx" values="690;175;690" dur="5.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="930" cy="349" r="10" fill="#FDE68A">
      <animate attributeName="cx" values="930;175;930" dur="4.3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g>
    <rect x="0" y="0" width="24" height="24" rx="6" fill="#60A5FA" opacity="0.9">
      <animate attributeName="x" values="1020;170;1020" dur="4.6s" repeatCount="indefinite"/>
      <animate attributeName="y" values="249;249;249" dur="4.6s" repeatCount="indefinite"/>
    </rect>
    <rect x="0" y="0" width="28" height="28" rx="8" fill="#A78BFA" opacity="0.92">
      <animate attributeName="x" values="980;170;980" dur="5.2s" repeatCount="indefinite"/>
      <animate attributeName="y" values="291;291;291" dur="5.2s" repeatCount="indefinite"/>
    </rect>
    <rect x="0" y="0" width="20" height="20" rx="5" fill="#F87171" opacity="0.94">
      <animate attributeName="x" values="940;170;940" dur="4.1s" repeatCount="indefinite"/>
      <animate attributeName="y" values="339;339;339" dur="4.1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <g class="pulse">
    <circle cx="1028" cy="261" r="11" fill="#22C55E"/>
    <circle cx="1028" cy="305" r="11" fill="#38BDF8"/>
    <circle cx="1028" cy="349" r="11" fill="#A78BFA"/>
  </g>

  <text x="170" y="401" class="label">FLUXO DE PROGRESSO</text>
  <rect x="170" y="413" width="860" height="18" rx="9" fill="rgba(255,255,255,0.09)"/>
  <rect x="170" y="413" width="220" height="18" rx="9" fill="url(#meter)">
    <animate attributeName="width" values="220;470;690;860;220" dur="7.2s" repeatCount="indefinite"/>
  </rect>

  <text x="1028" y="404" text-anchor="end" class="soft">Diagnosticar • Organizar • Entregar</text>
</svg>
