<svg width="1200" height="500" viewBox="0 0 1200 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="80" y1="40" x2="1120" y2="460" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07131E"/>
      <stop offset="0.52" stop-color="#0E2B1D"/>
      <stop offset="1" stop-color="#14532D"/>
    </linearGradient>
    <linearGradient id="track" x1="150" y1="0" x2="1050" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1D4ED8"/>
      <stop offset="0.45" stop-color="#22C55E"/>
      <stop offset="1" stop-color="#60A5FA"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="780" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22C55E"/>
      <stop offset="0.5" stop-color="#4ADE80"/>
      <stop offset="1" stop-color="#93C5FD"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .title { fill: #F8FAFC; font: 700 36px 'Segoe UI', Arial, sans-serif; }
      .subtitle { fill: #C0CAF5; opacity: 0.92; font: 500 18px 'Segoe UI', Arial, sans-serif; }
      .card-title { fill: #A7F3D0; font: 700 15px 'Segoe UI', Arial, sans-serif; letter-spacing: 1px; }
      .card-text { fill: #E2E8F0; font: 500 15px 'Segoe UI', Arial, sans-serif; }
      .label { fill: #E5F9EF; font: 700 16px 'Segoe UI', Arial, sans-serif; }
      .hint { fill: #C0CAF5; opacity: 0.82; font: 500 14px 'Segoe UI', Arial, sans-serif; }
      .panel { fill: rgba(255,255,255,0.05); stroke: rgba(255,255,255,0.12); stroke-width: 1.5; }
      .arena { fill: rgba(0,0,0,0.16); stroke: rgba(255,255,255,0.08); stroke-width: 1.5; }
      .pulse { animation: pulse 2.1s ease-in-out infinite; transform-origin: center; }
      .orb { animation: orb 1.9s ease-in-out infinite; transform-origin: center; }
      @keyframes pulse {
        0%, 100% { opacity: 0.78; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.13); }
      }
      @keyframes orb {
        0%, 100% { opacity: 0.45; transform: translateY(0px); }
        50% { opacity: 1; transform: translateY(-8px); }
      }
    </style>
  </defs>

  <rect x="12" y="12" width="1176" height="476" rx="30" fill="url(#bg)"/>
  <rect x="28" y="28" width="1144" height="444" rx="26" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.08)"/>

  <text x="600" y="66" text-anchor="middle" class="title">CHARGE RUN</text>
  <text x="600" y="96" text-anchor="middle" class="subtitle">Um minijogo visual sobre evolução técnica, energia e clareza na construção de soluções</text>

  <rect x="72" y="124" width="300" height="86" rx="20" class="panel"/>
  <text x="96" y="154" class="card-title">MISSÃO</text>
  <text x="96" y="180" class="card-text">Diagnosticar rápido, organizar melhor</text>
  <text x="96" y="201" class="card-text">e entregar com consistência.</text>

  <rect x="450" y="124" width="300" height="86" rx="20" class="panel"/>
  <text x="474" y="154" class="card-title">STACK ATUAL</text>
  <text x="474" y="180" class="card-text">React, Next.js, TypeScript</text>
  <text x="474" y="201" class="card-text">e interfaces mais confiáveis.</text>

  <rect x="828" y="124" width="300" height="86" rx="20" class="panel"/>
  <text x="852" y="154" class="card-title">OBJETIVO</text>
  <text x="852" y="180" class="card-text">Unir suporte, infraestrutura</text>
  <text x="852" y="201" class="card-text">e front-end em soluções fortes.</text>

  <rect x="86" y="238" width="1028" height="170" rx="28" class="arena"/>

  <path d="M150 327 C 255 265, 360 265, 470 320 C 580 375, 690 375, 800 315 C 900 260, 975 260, 1050 295"
        stroke="url(#track)" stroke-width="10" stroke-linecap="round" filter="url(#glow)"/>

  <circle cx="150" cy="327" r="14" fill="#22C55E" class="pulse"/>
  <circle cx="470" cy="320" r="14" fill="#60A5FA" class="pulse"/>
  <circle cx="800" cy="315" r="14" fill="#A78BFA" class="pulse"/>
  <circle cx="1050" cy="295" r="14" fill="#F59E0B" class="pulse"/>

  <text x="118" y="367" class="label">SUPORTE</text>
  <text x="438" y="360" class="label">INFRA</text>
  <text x="748" y="355" class="label">FRONT-END</text>
  <text x="1000" y="335" class="label">ENTREGA</text>

  <g class="orb">
    <circle cx="305" cy="292" r="8" fill="#FDE68A"/>
    <circle cx="640" cy="349" r="8" fill="#FDE68A"/>
    <circle cx="930" cy="275" r="8" fill="#FDE68A"/>
  </g>

  <g filter="url(#glow)">
    <rect x="-30" y="-18" width="60" height="36" rx="18" fill="#F8FAFC" stroke="#22C55E" stroke-width="3">
      <animateMotion dur="7s" repeatCount="indefinite" rotate="auto">
        <mpath href="#runnerPath"/>
      </animateMotion>
    </rect>
    <circle cx="0" cy="0" r="8" fill="#22C55E">
      <animateMotion dur="7s" repeatCount="indefinite" rotate="auto">
        <mpath href="#runnerPath"/>
      </animateMotion>
    </circle>
    <path d="M10 -8 L19 0 L10 8" stroke="#22C55E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <animateMotion dur="7s" repeatCount="indefinite" rotate="auto">
        <mpath href="#runnerPath"/>
      </animateMotion>
    </path>
  </g>

  <path id="runnerPath" d="M150 327 C 255 265, 360 265, 470 320 C 580 375, 690 375, 800 315 C 900 260, 975 260, 1050 295" fill="none"/>

  <text x="150" y="435" class="card-title">PROGRESSO DE EVOLUÇÃO</text>
  <rect x="150" y="448" width="900" height="16" rx="8" fill="rgba(255,255,255,0.08)"/>
  <rect x="150" y="448" width="260" height="16" rx="8" fill="url(#bar)">
    <animate attributeName="width" values="260;460;680;900;260" dur="7s" repeatCount="indefinite"/>
  </rect>
  <text x="1050" y="436" text-anchor="end" class="hint">Suporte -> Infra -> Front-end -> Entrega</text>
</svg>
